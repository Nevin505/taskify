<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/fa7595fb8b.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="mt-8 px-4 border py-2">
      <h1 class="text-center text-red-500 text-2xl">Add Your Todo's</h1>
      <button
        class="border border-red-600 px-4 py-2 rounded-md ml-auto block cursor-pointer relative z-9 right-8 z-99"
        onclick="handleClick()"
      >
        Add
      </button>
    </div>

    <div
      id="yourTodo"
      class="flex w-full border border-green-500 gap-4 px-8 py-4"
    >
      <div class="flex-1 flex flex-col gap-4 h-fit">
        <div class="flex flex-col gap-4" id="todo">
          Add Todo check list in here
        </div>
        <div
          class="flex justify-between px-4 bg-gray-600 py-2 rounded-lg text-white"  onclick="handleClick()"
        >
          <p >Add New</p>
          <span><i class="fa-solid fa-plus"></i></span>
        </div>
      </div>
      <div class="flex-1 flex flex-col gap-4 h-fit">
        <p>Doing</p>
        <div class="flex flex-col gap-4 min-h-[150px]" id="doing">
          Add Doing check list in here
        </div>
        <div
          class="flex justify-between px-4 bg-gray-600 py-2 rounded-lg text-white"  onclick="handleClick()"
        >
          <p>Add New</p>
          <span><i class="fa-solid fa-plus"></i></span>
        </div>
      </div>
      <div class="flex-1 flex flex-col gap-4 h-fit">
        <div class="flex flex-col gap-4 min-h-[150px]" id="completed">
          Add Completed list in here
        </div>
        <div
          class="flex justify-between px-4 bg-gray-600 py-2 rounded-lg text-white"  onclick="handleClick()"
        >
          <p>Add New</p>
          <span><i class="fa-solid fa-plus"></i></span>
        </div>
      </div>
    </div>

    <!-- Pop Up Modal -->
    <div
      class="close w-screen absolute top-0 bottom-0 left-0 right-0 h-screen items-center justify-center backdrop-blur-sm"
      id="popUpModal"
    >
      <div
        class="text-center border border-red-600 w-1/2 flex flex-col gap-4 py-2 px-4 rounded-md bg-gray-600"
      >
        <input
          type="text"
          placeholder="Add to do"
          class="px-4 py-4 rounded-md w-full bg-white"
          id="todoTitle"
        />
         <input
          type="text"
          placeholder="Add to do"
          class="px-4 py-4 rounded-md w-full bg-white"
          id="todoDecription"
        />
         <div class="flex gap-4 justify-between">
            <label for="">Status Level</label>
          <div>
            <label for="medium">Medium</label>
            <input type="radio" id="medium" name="complexeityLevel" value="medium" />
          </div>
          <div>
            <label for="hard">Hard</label>
            <input type="radio" id="hard" name="complexeityLevel" value="hard" />
          </div>
          <div>
            <label for="easy">Easy</label>
            <input
              type="radio"
              id="easy"
              name="complexeityLevel"
              value="easy"
            />
          </div>
        </div>
        <div class="flex gap-4 justify-between">
            <label >Status</label>
          <div>
            <label for="todo">Todo</label>
            <input type="radio" id="todo" name="todoStatus" value="todo" />
          </div>
          <div>
            <label for="doing">Doing</label>
            <input type="radio" id="doing" name="todoStatus" value="doing" />
          </div>
          <div>
            <label for="completed">Todo</label>
            <input
              type="radio"
              id="completed"
              name="todoStatus"
              value="completed"
            />
          </div>
        </div>
        <div class="mt-4 flex justify-between">
            <button class="px-4 py-3 border border-blue-400 rounded-sm  block" onclick="handleClick()">Close</button>
          <button
            class="px-4 py-3 border border-blue-400 rounded-sm  block"
            onclick="addToDo()"
          >
            Save Todo
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
